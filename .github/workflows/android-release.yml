name: Android TV release

# Builds, signs and publishes the TV app as a GitHub Release whenever the app changes on main
# (or on demand). The latest APK is served to TVs at https://movie-recs-tawny.vercel.app/tv.

on:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate (public). Android only installs updates signed by the same
  # key, so refuse to publish anything else.
  EXPECTED_CERT_SHA256: c5a1ffa5e6838f4f6be724a946fe2c0f2216808c1665a0feb2a954a055b0a3d4

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || { echo "::error::Add the RELEASE_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease --console=plain

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          # Output wording varies across build-tools versions; take the first certificate's SHA-256.
          ACTUAL=$(echo "$CERTS" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "$CERTS" # certificate details are public
            echo "::error::APK signed with unexpected certificate '$ACTUAL'"
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/movie-recs-tv.apk"
          (cd "$RUNNER_TEMP" && sha256sum movie-recs-tv.apk > movie-recs-tv.apk.sha256)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tv-v$VERSION_NAME" \
            "$RUNNER_TEMP/movie-recs-tv.apk" "$RUNNER_TEMP/movie-recs-tv.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Movie Recs TV $VERSION_NAME" \
            --notes "Install or update on the TV: open Downloader and go to https://movie-recs-tawny.vercel.app/tv (version code $VERSION_CODE, commit $GITHUB_SHA)."

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
