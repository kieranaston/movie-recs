name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Website — lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No app env vars on purpose: the build must succeed without them, like a Vercel preview.
    # Tests and e2e supply their own throwaway values and in-memory databases.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests (in-memory Postgres)
        run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build against in-memory Postgres)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  android:
    name: Android TV — lint, unit tests, release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Verifies the minified release build; publishing (with the real signing key) is android-release.yml.
      - run: ./gradlew lintDebug testDebugUnitTest assembleRelease -PverifyOnly=true --console=plain
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: android-tv/app/build/reports
          retention-days: 7

  android-device:
    name: Android TV — instrumented tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # A lightweight AOSP image: TV images are too heavy to boot on GitHub's 2-core runners.
          # These tests (Keystore, Compose UI, D-pad focus) don't depend on TV system apps; the leanback
          # manifest flag only filters store listings, not adb installs. Real-TV checks run locally.
          api-level: 34
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -no-metrics
          emulator-boot-timeout: 900
          disable-animations: true
          working-directory: android-tv
          script: ./gradlew connectedDebugAndroidTest --console=plain
