name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Website — lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The build never connects to a database; these only satisfy start-up checks. No real secrets in CI.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests (in-memory Postgres)
        run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build against in-memory Postgres)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  android:
    name: Android TV — lint, unit tests, release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Verifies the minified release build; publishing (with the real signing key) is android-release.yml.
      - run: ./gradlew lintDebug testDebugUnitTest assembleRelease -PverifyOnly=true --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: android-tv/app/build/reports
          retention-days: 7

  android-device:
    name: Android TV — instrumented tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          working-directory: android-tv
          script: ./gradlew connectedDebugAndroidTest --console=plain
